name: Release Executable

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: |
          pyinstaller --noconfirm --onefile --name 3D-to-2D --paths backend --add-data "frontend/dist;frontend_dist" --add-data "backend/app;app" --hidden-import=uvicorn --hidden-import=fastapi --hidden-import=cv2 --hidden-import=numpy --hidden-import=multipart run_app.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/3D-to-2D.exe
